<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시설관리">
<meta name="theme-color" content="#0f172a">
<title>시설관리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100dvh;}
.hdr{background:#1e3a5f;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #3b82f6;flex-shrink:0;}
.hdr h1{font-size:15px;font-weight:700;color:#60a5fa;flex:1;}
.hbtn{padding:6px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.hbtn.save{border-color:#10b981;color:#10b981;}
.ftabs{display:flex;background:#0f172a;border-bottom:1px solid #1e293b;flex-shrink:0;}
.ftab{flex:1;padding:9px 2px;font-size:12px;font-weight:600;border:none;background:none;color:#475569;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;touch-action:manipulation;}
.ftab.active{color:#60a5fa;border-bottom-color:#3b82f6;}
.main{flex:1;display:flex;overflow:hidden;position:relative;}
.sb{width:240px;background:#111827;border-right:1px solid #1e293b;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s;position:absolute;left:0;top:0;bottom:0;z-index:100;}
.sb.hidden{transform:translateX(-240px);}
.sb-tog{position:absolute;top:50%;transform:translateY(-50%);left:0;z-index:101;width:24px;height:48px;background:#1e3a5f;border:1px solid #3b82f6;border-left:none;border-radius:0 8px 8px 0;color:#60a5fa;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:left .25s;touch-action:manipulation;}
.sb-tog.open{left:240px;}
.sb-head{padding:9px;border-bottom:1px solid #1e293b;flex-shrink:0;}
.sb-q{width:100%;padding:9px 11px;background:#0f172a;border:1px solid #334155;border-radius:9px;color:#e2e8f0;font-size:14px;font-family:inherit;}
.sb-q:focus{outline:none;border-color:#3b82f6;}
.sb-btns{display:flex;gap:6px;margin-top:7px;}
.sb-btn{flex:1;padding:6px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;text-align:center;}
.sb-chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 9px;border-bottom:1px solid #1e293b;flex-shrink:0;}
.chip{padding:5px 11px;border-radius:11px;border:1px solid #334155;background:#1e293b;color:#64748b;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.chip.on{font-weight:700;}
.mgr-btn{padding:5px 9px;border-radius:11px;border:1px dashed #334155;background:none;color:#475569;font-size:11px;cursor:pointer;font-family:inherit;margin-left:auto;touch-action:manipulation;}
.sb-list{flex:1;overflow-y:auto;padding:6px 7px 10px;-webkit-overflow-scrolling:touch;}
.grp{margin-bottom:7px;}
.grp-hdr{display:flex;align-items:center;gap:9px;padding:11px 11px;background:#1e293b;border:1px solid #334155;border-radius:10px;cursor:pointer;user-select:none;touch-action:manipulation;}
.grp-hdr:active{background:#334155;}
.grp-nm{font-size:14px;font-weight:700;flex:1;color:#e2e8f0;}
.grp-cnt{font-size:12px;color:#94a3b8;background:#0f172a;padding:3px 9px;border-radius:9px;font-weight:700;}
.grp-arr{font-size:12px;color:#475569;transition:transform .2s;}
.grp-items{display:none;margin-top:3px;}
.grp-items.open{display:block;}
.fi{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;margin-bottom:3px;cursor:pointer;touch-action:manipulation;}
.fi:active,.fi.hl{background:#1e293b;}
.fi-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.fi-info{flex:1;min-width:0;}
.fi-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e2e8f0;}
.fi-sub{font-size:11px;color:#64748b;margin-top:2px;}
.fi-st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;flex-shrink:0;touch-action:manipulation;}
.fi-st.ok{background:#10b98122;color:#10b981;}
.fi-st.warn{background:#f59e0b22;color:#f59e0b;}
.fi-st.bad{background:#ef444422;color:#ef4444;}
.mapwrap{flex:1;position:relative;overflow:hidden;background:#1a1a2e;touch-action:none;margin-left:0;transition:margin-left .25s;}
.mapwrap.sb-open{margin-left:240px;}
#mapInner{position:absolute;top:50%;left:50%;transform-origin:center;will-change:transform;}
#mapInner img{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none;}
#mkLayer,#colLayer{position:absolute;inset:0;}
#colLayer{display:none;}
.mk{position:absolute;transform:translate(-50%,-50%);cursor:pointer;pointer-events:all;z-index:10;}
.mcirc{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.5);}
.mk.hl .mcirc{border-color:#ef4444!important;animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.mlbl{position:absolute;top:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:10px;white-space:nowrap;padding:2px 6px;border-radius:4px;pointer-events:none;}
.mxbtn{position:absolute;top:-7px;right:-7px;width:17px;height:17px;background:#ef4444;border-radius:50%;font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer;color:#fff;pointer-events:all;}
.mk:hover .mxbtn{display:flex;}
.col-mk{position:absolute;transform:translate(-50%,-50%);cursor:pointer;pointer-events:all;z-index:8;}
.col-circ{width:22px;height:22px;border-radius:50%;background:rgba(245,158,11,.15);border:2px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#f59e0b;}
.col-mk.hl .col-circ{background:rgba(245,158,11,.5);border-color:#fff;box-shadow:0 0 0 6px rgba(245,158,11,.3);}
.toolbar{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;z-index:20;}
.tbtn{width:38px;height:38px;border-radius:9px;border:1px solid #334155;background:rgba(15,23,42,.92);color:#94a3b8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);touch-action:manipulation;}
.edit-bar{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:5px;z-index:20;}
.ebtn{padding:7px 10px;border-radius:8px;border:1px solid #334155;background:rgba(15,23,42,.92);color:#94a3b8;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);touch-action:manipulation;}
.ebtn.active{border-color:#f59e0b;color:#f59e0b;background:rgba(30,20,0,.92);}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.modal{background:#1e293b;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;border-top:1px solid #334155;-webkit-overflow-scrolling:touch;}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px;padding-right:28px;}
.mclose{position:absolute;top:12px;right:14px;background:none;border:none;color:#64748b;font-size:26px;cursor:pointer;touch-action:manipulation;line-height:1;}
.ig{margin-bottom:11px;}
.ig label{display:block;font-size:11px;color:#64748b;margin-bottom:3px;font-weight:700;}
.ig input,.ig select,.ig textarea{width:100%;padding:9px 11px;background:#0f172a;border:1px solid #334155;border-radius:9px;color:#e2e8f0;font-size:14px;font-family:inherit;-webkit-appearance:none;}
.ig input:focus,.ig select:focus,.ig textarea:focus{outline:none;border-color:#3b82f6;}
.br{display:flex;gap:8px;margin-top:14px;}
.bp{flex:1;padding:11px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.bs{flex:none;padding:11px 16px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.dbadge{display:inline-block;font-size:11px;font-weight:700;padding:3px 11px;border-radius:12px;margin-bottom:7px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0;}
.dc{background:#0f172a;border-radius:8px;padding:8px 10px;}
.dl{font-size:10px;color:#64748b;margin-bottom:2px;}
.dv{font-size:13px;font-weight:700;}
.memo-box{background:#0f172a;border-radius:8px;padding:10px;border-left:3px solid #3b82f6;margin-bottom:9px;}
.act-row{display:flex;gap:7px;margin:9px 0;}
.abtn{flex:1;padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.abtn.e{border-color:#3b82f6;color:#60a5fa;}
.abtn.d{border-color:#ef4444;color:#ef4444;}
.efm{background:#0f172a;border-radius:9px;padding:11px;margin:4px 0 9px;display:none;border:1px solid #334155;}
.lhdr{display:flex;align-items:center;justify-content:space-between;margin:11px 0 7px;}
.lhdr h3{font-size:13px;font-weight:700;}
.ladd{padding:5px 10px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.lfm{background:#0f172a;border-radius:8px;padding:10px;margin-bottom:9px;display:none;border:1px solid #334155;}
.litem{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #1e293b;}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.ldel{color:#ef4444;cursor:pointer;font-size:18px;touch-action:manipulation;}
.nodata{font-size:12px;color:#475569;padding:10px 0;text-align:center;}
.cdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;touch-action:manipulation;}
.cdot.sel{border-color:#fff;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #3b82f6;border-radius:11px;padding:10px 20px;font-size:13px;font-weight:600;z-index:9000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
#loading{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#loading.hide{display:none;}
.spin{width:44px;height:44px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div style="font-size:15px;color:#60a5fa;font-weight:700">🏢 시설관리</div>
  <div style="font-size:11px;color:#475569">도면 로딩 중...</div>
</div>
<div class="hdr">
  <h1>🏢 시설관리</h1>
  <button class="hbtn save" onclick="doSave()">☁️ 저장</button>
</div>
<div class="ftabs">
  <button class="ftab active" onclick="switchFloor('B1')">지하1층</button>
  <button class="ftab" onclick="switchFloor('B2')">지하2층</button>
  <button class="ftab" onclick="switchFloor('B3')">지하3층</button>
  <button class="ftab" onclick="switchFloor('B4')">지하4층</button>
</div>
<div class="main">
  <div class="sb hidden" id="sb">
    <div class="sb-head">
      <input class="sb-q" id="sbQ" placeholder="🔍 이름, 메모 검색..." oninput="buildList()">
      <div class="sb-btns">
        <button class="sb-btn" onclick="collapseAll()">▲ 전체 접기</button>
        <button class="sb-btn" onclick="expandAll()">▼ 전체 펼치기</button>
      </div>
    </div>
    <div class="sb-chips" id="chips"></div>
    <div class="sb-list" id="sbList"></div>
  </div>
  <button class="sb-tog" id="sbTog" onclick="toggleSb()">▶</button>
  <div class="mapwrap" id="mw">
    <div id="mapInner">
      <img id="floorImg" alt="도면">
      <div id="mkLayer"></div>
      <div id="colLayer"></div>
    </div>
    <div class="toolbar">
      <button class="tbtn" onclick="zoom(1.3)">＋</button>
      <button class="tbtn" onclick="zoom(0.77)">－</button>
      <button class="tbtn" onclick="resetView()">⊙</button>
    </div>
    <div class="edit-bar">
      <button class="ebtn" id="eFac" onclick="setMode('facility')">🔧 시설</button>
      <button class="ebtn" id="eDong" onclick="setMode('dong')">🏢 동</button>
      <button class="ebtn" id="eEnt" onclick="setMode('entrance')">🚪 입구</button>
      <button class="ebtn" id="eCol" onclick="setMode('column')">🔵 기둥</button>
      <button class="ebtn" id="eColShow" onclick="toggleColLayer()" style="font-size:10px">기둥표시</button>
      <button class="ebtn active" id="eMove" onclick="setMode('move')">✋ 이동</button>
    </div>
  </div>
</div>

<div class="ov" id="addOv">
  <div class="modal" style="position:relative">
    <button class="mclose" onclick="closeOv('addOv')">×</button>
    <h2 id="addTitle">시설 추가</h2>
    <div class="ig" id="addTG"><label>유형</label><select id="addType" onchange="suggestName()"></select></div>
    <div class="ig"><label>이름</label><input id="addName" placeholder="예: 졸러펌프 #1"></div>
    <div class="ig"><label>메모</label><textarea id="addNote" placeholder="위치, 수량 등" style="min-height:65px;resize:none;"></textarea></div>
    <div class="br"><button class="bs" onclick="closeOv('addOv')">취소</button><button class="bp" onclick="saveMarker()">추가</button></div>
  </div>
</div>

<div class="ov" id="colOv">
  <div class="modal" style="position:relative;max-width:320px">
    <button class="mclose" onclick="closeOv('colOv')">×</button>
    <h2>🔵 기둥번호</h2>
    <div class="ig"><input id="colNum" type="number" placeholder="번호 입력 (예: 10)" style="font-size:20px;text-align:center;padding:14px;"></div>
    <div class="br"><button class="bs" onclick="closeOv('colOv')">취소</button><button class="bp" onclick="saveCol()">저장</button></div>
  </div>
</div>

<div class="ov" id="detOv">
  <div class="modal" style="position:relative">
    <button class="mclose" onclick="closeOv('detOv')">×</button>
    <span class="dbadge" id="dBadge"></span>
    <h2 id="dName"></h2>
    <div class="dgrid" id="dGrid"></div>
    <div class="memo-box" id="dMemo"></div>
    <div class="act-row">
      <button class="abtn e" onclick="toggleEFm()">✏️ 수정</button>
      <button class="abtn d" onclick="delMk()">🗑 삭제</button>
    </div>
    <div class="efm" id="eFm">
      <div class="ig"><label>이름</label><input id="eName"></div>
      <div class="ig" id="eTG"><label>유형</label><select id="eType"></select></div>
      <div class="ig"><label>메모</label><textarea id="eNote" style="min-height:60px;resize:none;"></textarea></div>
      <div class="br"><button class="bs" onclick="toggleEFm()">취소</button><button class="bp" onclick="saveEdit()">저장</button></div>
    </div>
    <div class="lhdr"><h3>유지보수 기록</h3><button class="ladd" onclick="toggleLFm()">+ 추가</button></div>
    <div class="lfm" id="lFm">
      <div class="ig"><label>작업유형</label><select id="lType"><option>청소</option><option>부품교체</option><option>점검</option><option>수리</option></select></div>
      <div class="ig"><label>날짜</label><input type="date" id="lDate"></div>
      <div class="ig"><label>내용</label><input id="lContent" placeholder="예: 필터 청소 완료"></div>
      <div class="br"><button class="bs" onclick="toggleLFm()">취소</button><button class="bp" onclick="saveLog()">저장</button></div>
    </div>
    <div id="lItems"></div>
  </div>
</div>

<div class="ov" id="typeOv">
  <div class="modal" style="position:relative;max-width:360px">
    <button class="mclose" onclick="closeOv('typeOv')">×</button>
    <h2>⚙ 시설 유형 관리</h2>
    <div id="typeList"></div>
    <div style="border-top:1px solid #334155;margin-top:11px;padding-top:11px">
      <div style="font-size:12px;color:#60a5fa;font-weight:700;margin-bottom:9px">새 유형 추가</div>
      <div class="ig"><label>이름</label><input id="ntName" placeholder="예: MCC판넬, 소방펌프"></div>
      <div class="ig"><label>색상</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px" id="cPal"></div></div>
      <input type="color" id="ntColor" value="#3b82f6" style="display:none">
      <button class="bp" onclick="addType()" style="width:100%;margin-top:9px">+ 추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const IMGS={B1:'b1.jpg',B2:'b2.jpg',B3:'b3.jpg',B4:'b4.jpg'};
const LOGC={청소:'#10b981',부품교체:'#f59e0b',점검:'#3b82f6',수리:'#ef4444'};
const FN={B1:'지하1층',B2:'지하2층',B3:'지하3층',B4:'지하4층'};

mw.addEventListener('mousedown',e=>{

});
document.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>3)didDrag=true;
  tx+=dx;ty+=dy;lx=e.clientX;ly=e.clientY;applyTF();
});
document.addEventListener('mouseup',e=>{
  if(!drag)return;drag=false;
  if(!didDrag&&mode!=='move'){
    const r=fi.getBoundingClientRect();
    const px=((e.clientX-r.left)/r.width)*100,py=((e.clientY-r.top)/r.height)*100;
    if(px>=0&&px<=100&&py>=0&&py<=100){pxy={x:px,y:py};mode==='column'?openColOv():openAddOv();}

  didDrag=false;
  if(e.touches.length===2){pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  else{lx=e.touches[0].clientX;ly=e.touches[0].clientY;}

  else{const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;if(Math.abs(dx)+Math.abs(dy)>4)didDrag=true;tx+=dx;ty+=dy;lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyTF();}
},{passive:false});

function renderMk(){

    const lbl=mk.name.length>8?mk.name.slice(0,8)+'…':mk.name;
    el.innerHTML=`<div class="mcirc" style="background:${c}">${ini}</div><div class="mlbl">${lbl}</div><div class="mxbtn">×</div>`;
    el.querySelector('.mxbtn').addEventListener('click',ev=>{ev.stopPropagation();quickDel(mk.id);});
    el.addEventListener('click',ev=>{ev.stopPropagation();openDetail(mk.id);});

function buildChips(){

  h+=types.map(t=>{const c=GC(t),on=activeF.has(t)&&!allOn;return `<button class="chip${on?' on':''}" style="${on?`border-color:${c};color:${c};background:${c}11`:''}" onclick="toggleF('${t}')">${GN(t)} ${list.filter(m=>m.type===t).length}</button>`;}).join('');

}
function natSort(a,b){return a.name.localeCompare(b.name,'ko',{numeric:true});}
function getStatus(m){
  if(m.type==='dong'||m.type==='entrance')return null;
  const logs=m.logs||[];
  if(!logs.length)return{cls:'warn',txt:'미기록'};
  const last=[...logs].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const days=Math.floor((new Date()-new Date(last.date))/86400000);
  if(last.type==='수리')return{cls:'bad',txt:'수리됨'};
  if(days>180)return{cls:'warn',txt:'점검필요'};
  return{cls:'ok',txt:'정상'};
}
function buildList(){
  const q=document.getElementById('sbQ').value.toLowerCase();
  const isNum=q&&/^\d+$/.test(q.trim());
  const searchNum=isNum?parseInt(q):null;
  const saved=JSON.parse(sessionStorage.getItem('grp_open')||'{}');
  let list=(markers[curFloor]||[]).filter(m=>{
    if(!activeF.has('all')&&!activeF.has(m.type))return false;
    if(q&&!m.name.toLowerCase().includes(q)&&!(m.note||'').toLowerCase().includes(q))return false;
    return true;
  }).sort(natSort);
  if(isNum){
    hlColId=null;
    const col=(columns[curFloor]||[]).find(c=>c.num===searchNum);
    if(col){hlColId=col.id;if(!showCols)toggleColLayer();else renderCols();
      const iw=fi.naturalWidth||1800,ih=fi.naturalHeight||1273;
      tx=-(col.x/100-.5)*iw*sc;ty=-(col.y/100-.5)*ih*sc;applyTF();
    } else {
      const withCol=(columns[curFloor]||[]).filter(c=>c.num!=null).sort((a,b)=>a.num-b.num);
      const below=withCol.filter(c=>c.num<searchNum).pop();
      const above=withCol.find(c=>c.num>searchNum);
      const nearNums=[below?.num,above?.num].filter(n=>n!=null);
      if(nearNums.length)list=list.filter(m=>(m.column!=null&&nearNums.includes(m.column)));
    }
  }
  const groups={};list.forEach(m=>{if(!groups[m.type])groups[m.type]=[];groups[m.type].push(m);});
  const el=document.getElementById('sbList');
  if(!list.length){el.innerHTML='<div class="nodata">검색 결과 없음</div>';return;}
  el.innerHTML='';
  Object.entries(groups).forEach(([type,items])=>{
    const c=GC(type),key=curFloor+'_'+type,isOpen=saved[key]===true;
    const grp=document.createElement('div');grp.className='grp';
    const hdr=document.createElement('div');hdr.className='grp-hdr';
    hdr.innerHTML=`<div style="width:13px;height:13px;border-radius:50%;background:${c};flex-shrink:0"></div><div class="grp-nm">${GN(type)}</div><span class="grp-cnt">${items.length}</span><span class="grp-arr" style="transform:${isOpen?'':'rotate(-90deg)'}">▼</span>`;
    const toggle=()=>{
      const body=grp.querySelector('.grp-items'),arr=hdr.querySelector('.grp-arr');
      const open=body.classList.toggle('open');arr.style.transform=open?'':'rotate(-90deg)';
      const s=JSON.parse(sessionStorage.getItem('grp_open')||'{}');s[key]=open;sessionStorage.setItem('grp_open',JSON.stringify(s));
    };
    hdr.addEventListener('click',toggle);hdr.addEventListener('touchend',ev=>{ev.preventDefault();toggle();});
    const body=document.createElement('div');body.className='grp-items'+(isOpen?' open':'');
    items.sort(natSort).forEach(m=>{
      const st=getStatus(m);
      const row=document.createElement('div');row.className='fi'+(m.id===hlId?' hl':'');row.id='fi_'+m.id;
      const dot=document.createElement('div');dot.className='fi-dot';dot.style.background=c;
      const info=document.createElement('div');info.className='fi-info';
      info.innerHTML=`<div class="fi-name">${m.name}</div><div class="fi-sub">${FN[m.floor]||m.floor}${m.column!=null?' · '+m.column+'번 기둥':''}</div>`;
      const onFocus=()=>focusMk(m.id);
      info.addEventListener('click',onFocus);info.addEventListener('touchend',ev=>{ev.preventDefault();onFocus();});
      row.appendChild(dot);row.appendChild(info);
      if(st){const s=document.createElement('span');s.className='fi-st '+st.cls;s.textContent=st.txt;const onDet=()=>openDetail(m.id);s.addEventListener('click',onDet);s.addEventListener('touchend',ev=>{ev.preventDefault();onDet();});row.appendChild(s);}
      body.appendChild(row);
    });
    grp.appendChild(hdr);grp.appendChild(body);el.appendChild(grp);
  });
}

  const c=GC(m.type),b=document.getElementById('dBadge');
  b.textContent=GN(m.type);b.style.cssText=`background:${c}22;color:${c};border:1px solid ${c}`;
  document.getElementById('dName').textContent=m.name;
  const logs=m.logs||[],last=logs.length?[...logs].sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
  document.getElementById('dGrid').innerHTML=
    `<div class="dc"><div class="dl">층</div><div class="dv">${FN[m.floor]||m.floor}</div></div>`
    +`<div class="dc"><div class="dl">유형</div><div class="dv">${GN(m.type)}</div></div>`
    +`<div class="dc"><div class="dl">기둥번호</div><div class="dv" style="color:${c}">${m.column!=null?m.column+'번':'미등록'}</div></div>`
    +`<div class="dc"><div class="dl">기록수</div><div class="dv">${logs.length}건</div></div>`;
  document.getElementById('dMemo').innerHTML='<div style="font-size:11px;color:#3b82f6;font-weight:700;margin-bottom:4px">📝 메모</div>'
    +'<div style="font-size:13px;color:#cbd5e1;white-space:pre-wrap">'+(m.note?m.note.replace(/</g,'&lt;'):'<span style="color:#475569;font-style:italic">메모 없음</span>')+'</div>';
  document.getElementById('eFm').style.display='none';document.getElementById('lFm').style.display='none';
  renderLogs(m);document.getElementById('detOv').classList.add('show');
}
function toggleEFm(){
  const f=document.getElementById('eFm'),show=f.style.display==='block';
  if(!show){const m=findMk(curId);if(!m)return;document.getElementById('eName').value=m.name;document.getElementById('eNote').value=m.note||'';const isFixed=m.type==='dong'||m.type==='entrance';document.getElementById('eTG').style.display=isFixed?'none':'block';if(!isFixed){buildTS('eType');document.getElementById('eType').value=m.type;}}
  f.style.display=show?'none':'block';
}
function saveEdit(){
  const m=findMk(curId);if(!m)return;const name=document.getElementById('eName').value.trim();if(!name){alert('이름을 입력해주세요.');return;}
  m.name=name;m.note=document.getElementById('eNote').value.trim();const isFixed=m.type==='dong'||m.type==='entrance';if(!isFixed)m.type=document.getElementById('eType').value;
  save();renderMk();buildSb();document.getElementById('eFm').style.display='none';openDetail(curId);toast('✅ 수정됨');
}
function delMk(){
  const m=findMk(curId);if(!m)return;if(!confirm("'"+m.name+"' 삭제할까요?"))return;
  delById(curId);curId=null;save();renderMk();buildSb();closeOv('detOv');toast('🗑 삭제됨');
}
function toggleLFm(){const f=document.getElementById('lFm');if(f.style.display!=='block')document.getElementById('lDate').value=new Date().toISOString().slice(0,10);f.style.display=f.style.display==='block'?'none':'block';}
function saveLog(){
  const m=findMk(curId);if(!m)return;const date=document.getElementById('lDate').value,content=document.getElementById('lContent').value.trim();if(!date||!content){alert('날짜와 내용을 입력해주세요.');return;}
  if(!m.logs)m.logs=[];m.logs.push({id:'lg'+Date.now(),type:document.getElementById('lType').value,date,content});
  save();document.getElementById('lContent').value='';document.getElementById('lFm').style.display='none';renderLogs(m);buildSb();toast('✅ 기록 저장됨');
}
function delLog(lid){const m=findMk(curId);if(!m)return;m.logs=m.logs.filter(l=>l.id!==lid);save();renderLogs(m);buildSb();}
function renderLogs(m){
  const logs=(m.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('lItems');
  if(!logs.length){el.innerHTML='<div class="nodata">기록 없음</div>';return;}
  el.innerHTML='';
  logs.forEach(l=>{
    const row=document.createElement('div');row.className='litem';
    const dot=document.createElement('div');dot.className='ldot';dot.style.background=LOGC[l.type]||'#94a3b8';
    const info=document.createElement('div');info.style.cssText='flex:1;font-size:13px;line-height:1.5';
    info.innerHTML=`<strong style="color:${LOGC[l.type]||'#94a3b8'}">${l.type}</strong> — ${l.content}<br><span style="color:#64748b;font-size:11px">${l.date}</span>`;
    const del=document.createElement('span');del.className='ldel';del.textContent='×';
    del.addEventListener('click',()=>delLog(l.id));del.addEventListener('touchend',ev=>{ev.preventDefault();delLog(l.id);});
    row.appendChild(dot);row.appendChild(info);row.appendChild(del);el.appendChild(row);
  });
}
function openTM(){
  renderTL();const p=document.getElementById('cPal');p.innerHTML='';
  PALETTE.forEach(c=>{const d=document.createElement('div');d.className='cdot';d.style.background=c;d.addEventListener('click',()=>{document.getElementById('ntColor').value=c;p.querySelectorAll('.cdot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');});d.addEventListener('touchend',ev=>{ev.preventDefault();d.click();});p.appendChild(d);});
  document.getElementById('typeOv').classList.add('show');
}
function renderTL(){document.getElementById('typeList').innerHTML=Object.entries(customTypes).map(([k,v])=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 9px;background:#0f172a;border-radius:8px;margin-bottom:5px"><div style="width:14px;height:14px;border-radius:50%;background:${v.color}"></div><span style="flex:1;font-size:13px">${v.name}</span><button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:20px;touch-action:manipulation" onclick="delType('${k}')">×</button></div>`).join('')||'<div style="font-size:12px;color:#475569;padding:7px 0">추가된 유형 없음</div>';}
function addType(){const name=document.getElementById('ntName').value.trim(),color=document.getElementById('ntColor').value;if(!name){alert('이름을 입력해주세요.');return;}customTypes['ct_'+Date.now()]={name,color};save();document.getElementById('ntName').value='';renderTL();buildSb();toast('✅ 유형 추가: '+name);}
function delType(k){if(!confirm("'"+customTypes[k].name+"' 삭제할까요?"))return;delete customTypes[k];save();renderTL();buildSb();toast('🗑 유형 삭제됨');}
async function doSave(){
  const data={markers,customTypes,columns};
  let token=localStorage.getItem('gh_token');
  if(!token){token=prompt('GitHub Personal Access Token\n(한 번만 입력하면 저장됩니다)');if(!token){toast('❌ 취소됨');return;}localStorage.setItem('gh_token',token);}
  toast('☁️ 저장 중...');
  const API='https://api.github.com/repos/obsidian-jc/sisel-gwanri/contents/data.json';
  const headers={'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
  try{
    let sha=null;const gr=await fetch(API,{headers});if(gr.ok)sha=(await gr.json()).sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const pr=await fetch(API,{method:'PUT',headers,body:JSON.stringify({message:'데이터 업데이트 '+new Date().toLocaleString('ko-KR'),content,sha})});
    if(pr.ok)toast('✅ 저장 완료!');
    else{const e=await pr.json();if(pr.status===401){localStorage.removeItem('gh_token');toast('❌ 토큰 오류');}else toast('❌ 오류: '+(e.message||pr.status));}
  }catch(e){toast('❌ 네트워크 오류');}
}
async function loadFromGitHub(){
  try{
    const url='https://obsidian-jc.github.io/sisel-gwanri/data.json?t='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)return;
    const data=await res.json();
    if(data.markers)markers=data.markers;
    if(data.customTypes)customTypes=data.customTypes;
    if(data.columns)columns=data.columns;
    save();renderMk();renderCols();buildSb();toast('✅ 최신 데이터 동기화됨');
  }catch(e){}
}
function closeOv(id){document.getElementById(id).classList.remove('show');}
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2500);}
switchFloor('B1');
setTimeout(loadFromGitHub,1500);
window.addEventListener('online',()=>loadFromGitHub());
</script>
